name: tests

# CI only runs the deterministic test-suite and produces the JUnit evidence.
# No scheduled trading is enabled (the project brief forbids automatic schedules).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test-suite (offline, deterministic fixtures)
        run: python -m pytest -q --junitxml=reports/pytest.xml

      - name: Validate report artefacts
        run: python -m src.validate_reports

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: reports/pytest.xml
